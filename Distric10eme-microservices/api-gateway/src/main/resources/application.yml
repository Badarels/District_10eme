server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      routes:
        - id: user-service
          uri: lb://user-service
          predicates:
            - Path=/api/users/**
          filters:
            - StripPrefix=1
        - id: patient-service
          uri: lb://patient-service
          predicates:
            - Path=/api/patients/**
          filters:
            - StripPrefix=1
        - id: personnel-service
          uri: lb://personnel-service
          predicates:
            - Path=/api/personnel/**
          filters:
            - StripPrefix=1
        - id: specialites-service
          uri: lb://personnel-service
          predicates:
            - Path=/api/specialites/**
          filters:
            - StripPrefix=1
        - id: rendezvous-service
          uri: lb://rendezvous-service
          predicates:
            - Path=/api/rendezvous/**
          filters:
            - StripPrefix=1
        - id: consultation-service
          uri: lb://consultation-service
          predicates:
            - Path=/api/consultations/**
          filters:
            - StripPrefix=1
        - id: hospitalisation-service
          uri: lb://hospitalisation-service
          predicates:
            - Path=/api/hospitalisations/**
          filters:
            - StripPrefix=1
        - id: reporting-service
          uri: lb://reporting-service
          predicates:
            - Path=/api/reporting/**
          filters:
            - StripPrefix=1
        - id: notification-service
          uri: lb://notification-service
          predicates:
            - Path=/api/notifications/**
          filters:
            - StripPrefix=1
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins: "*"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
            allowedHeaders: "*"
            allowCredentials: true

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

jwt:
  secret: your-secret-key-change-in-production-minimum-256-bits
  expiration: 86400000

