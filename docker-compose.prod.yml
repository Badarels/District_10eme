services:
  # Base de données PostgreSQL
  postgres:
    image: postgres:15-alpine
    container_name: sih-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: sih_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - sih-network

  # Kafka (KRaft mode - sans Zookeeper)
  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: sih-kafka
    restart: unless-stopped
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka:29093'
      KAFKA_LISTENERS: 'PLAINTEXT://0.0.0.0:29092,CONTROLLER://0.0.0.0:29093,PLAINTEXT_HOST://0.0.0.0:9092'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'PLAINTEXT'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      CLUSTER_ID: 'MkU3OEVBNTcwNTJENDM2Qk'
    volumes:
      - kafka_data:/var/lib/kafka/data
    networks:
      - sih-network

  # 1. Service Discovery (Eureka)
  service-registry:
    build:
      context: ./Distric10eme-microservices/service-registry
      dockerfile: Dockerfile
    container_name: service-registry
    restart: unless-stopped
    ports:
      - "8761:8761"
    environment:
      - EUREKA_INSTANCE_HOSTNAME=service-registry
      - EUREKA_CLIENT_REGISTER_WITH_EUREKA=false
      - EUREKA_CLIENT_FETCH_REGISTRY=false
    networks:
      - sih-network

  # 2. API Gateway
  api-gateway:
    build:
      context: ./Distric10eme-microservices/api-gateway
      dockerfile: Dockerfile
    container_name: api-gateway
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://service-registry:8761/eureka/
    depends_on:
      - service-registry
    networks:
      - sih-network

  # 3. Microservices Métiers
  user-service:
    build:
      context: ./Distric10eme-microservices/user-service
      dockerfile: Dockerfile
    container_name: user-service
    restart: unless-stopped
    environment:
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://service-registry:8761/eureka/
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/sih_db
    depends_on:
      - service-registry
      - postgres
    networks:
      - sih-network

  patient-service:
    build:
      context: ./Distric10eme-microservices/patient-service
      dockerfile: Dockerfile
    container_name: patient-service
    restart: unless-stopped
    environment:
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://service-registry:8761/eureka/
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/sih_db
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:29092
    depends_on:
      - service-registry
      - postgres
      - kafka
    networks:
      - sih-network

  rendezvous-service:
    build:
      context: ./Distric10eme-microservices/rendezvous-service
      dockerfile: Dockerfile
    container_name: rendezvous-service
    restart: unless-stopped
    environment:
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://service-registry:8761/eureka/
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/sih_db
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:29092
    depends_on:
      - service-registry
      - postgres
      - kafka
    networks:
      - sih-network

  consultation-service:
    build:
      context: ./Distric10eme-microservices/consultation-service
      dockerfile: Dockerfile
    container_name: consultation-service
    restart: unless-stopped
    environment:
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://service-registry:8761/eureka/
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/sih_db
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:29092
    depends_on:
      - service-registry
      - postgres
      - kafka
    networks:
      - sih-network

  hospitalisation-service:
    build:
      context: ./Distric10eme-microservices/hospitalisation-service
      dockerfile: Dockerfile
    container_name: hospitalisation-service
    restart: unless-stopped
    environment:
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://service-registry:8761/eureka/
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/sih_db
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:29092
    depends_on:
      - service-registry
      - postgres
      - kafka
    networks:
      - sih-network

  reporting-service:
    build:
      context: ./Distric10eme-microservices/reporting-service
      dockerfile: Dockerfile
    container_name: reporting-service
    restart: unless-stopped
    environment:
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://service-registry:8761/eureka/
    depends_on:
      - service-registry
    networks:
      - sih-network

  notification-service:
    build:
      context: ./Distric10eme-microservices/notification-service
      dockerfile: Dockerfile
    container_name: notification-service
    restart: unless-stopped
    environment:
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://service-registry:8761/eureka/
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/sih_db
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:29092
    depends_on:
      - service-registry
      - postgres
      - kafka
    networks:
      - sih-network

  personnel-service:
    build:
      context: ./Distric10eme-microservices/personnel-service
      dockerfile: Dockerfile
    container_name: personnel-service
    restart: unless-stopped
    environment:
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://service-registry:8761/eureka/
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/sih_db
    depends_on:
      - service-registry
      - postgres
    networks:
      - sih-network

  # 4. Frontend Angular
  frontend-web:
    build:
      context: ./Distric10eme-web
      dockerfile: Dockerfile
    container_name: sih-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - api-gateway
    networks:
      - sih-network

networks:
  sih-network:
    driver: bridge

volumes:
  postgres_data:
  kafka_data:
