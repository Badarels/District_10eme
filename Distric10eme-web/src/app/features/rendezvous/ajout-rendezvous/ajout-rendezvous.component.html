<div class="pagetitle">
  <h1>Nouveau rendez-vous</h1>
  <nav>
    <ol class="breadcrumb">
      <li class="breadcrumb-item"><a [routerLink]="'/dashboard'">Accueil</a></li>
      <li class="breadcrumb-item"><a [routerLink]="'/rendezvous'">Rendez-vous</a></li>
      <li class="breadcrumb-item active">Création</li>
    </ol>
  </nav>
</div>

<section class="section">
  <div class="content-body">
    <div class="container-fluid">
      <div class="row">
        <div class="col-lg-12">
          <div class="card">
            <div class="card-body">
              <h2 class="card-title">Informations du rendez-vous</h2>
              <form [formGroup]="rendezVousForm" (ngSubmit)="onSubmit()">
                <div class="row g-3">
                  <div class="col-md-6">
                    <label class="form-label">Patient <span class="text-danger">*</span></label>
                    <input type="number" class="form-control" formControlName="patientId" placeholder="Identifiant patient" />
                  </div>
                  <div class="col-md-6">
                    <label class="form-label">Médecin <span class="text-danger">*</span></label>
                    <input type="number" class="form-control" formControlName="medecinId" placeholder="Identifiant médecin" />
                  </div>
                  <div class="col-md-6">
                    <label class="form-label">Date et heure <span class="text-danger">*</span></label>
                    <input type="datetime-local" class="form-control" formControlName="dateHeure" />
                  </div>
                  <div class="col-md-6">
                    <label class="form-label">Motif</label>
                    <input type="text" class="form-control" formControlName="motif" placeholder="Objet du rendez-vous" />
                  </div>
                  <div class="col-12">
                    <label class="form-label">Statut</label>
                    <input type="text" class="form-control" formControlName="statut" placeholder="Ex : Confirmé, En attente..." />
                  </div>
                </div>

                <div class="d-flex justify-content-end gap-2 mt-4">
                  <button type="button" class="btn btn-outline-secondary" (click)="onCancel()">Annuler</button>
                  <button type="submit" class="btn btn-primary" [disabled]="loading || rendezVousForm.invalid">
                    <span *ngIf="loading" class="spinner-border spinner-border-sm me-2"></span>
                    Enregistrer
                  </button>
                </div>
              </form>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
