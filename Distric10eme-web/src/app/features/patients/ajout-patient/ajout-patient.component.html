<div class="pagetitle">
  <h1>Nouveau patient</h1>
  <nav>
    <ol class="breadcrumb">
      <li class="breadcrumb-item"><a [routerLink]="'/dashboard'">Accueil</a></li>
      <li class="breadcrumb-item"><a [routerLink]="'/patients'">Patients</a></li>
      <li class="breadcrumb-item active">Création</li>
    </ol>
  </nav>
</div>

<section class="section">
  <div class="content-body">
    <div class="container-fluid">
      <div class="row">
        <div class="col-lg-12">
          <div class="card">
            <div class="card-body">
              <h2 class="card-title">Informations du patient</h2>
              <form [formGroup]="patientForm" (ngSubmit)="onSubmit()">
        <div class="row">
          <div class="col-md-6 mb-3">
            <label class="form-label">Numéro de Dossier <span class="text-danger">*</span></label>
            <input
              type="text"
              class="form-control"
              formControlName="numeroDossier"
              [class.is-invalid]="patientForm.get('numeroDossier')?.invalid && patientForm.get('numeroDossier')?.touched"
            />
            <div class="invalid-feedback" *ngIf="patientForm.get('numeroDossier')?.invalid && patientForm.get('numeroDossier')?.touched">
              Le numéro de dossier est requis
            </div>
          </div>

          <div class="col-md-6 mb-3">
            <label class="form-label">Groupe Sanguin</label>
            <select class="form-select" formControlName="groupeSanguin">
              <option value="">Sélectionner</option>
              <option value="O+">O+</option>
              <option value="O-">O-</option>
              <option value="A+">A+</option>
              <option value="A-">A-</option>
              <option value="B+">B+</option>
              <option value="B-">B-</option>
              <option value="AB+">AB+</option>
              <option value="AB-">AB-</option>
            </select>
          </div>
        </div>

        <div class="row">
          <div class="col-md-6 mb-3">
            <label class="form-label">Nom <span class="text-danger">*</span></label>
            <input
              type="text"
              class="form-control"
              formControlName="nom"
              [class.is-invalid]="patientForm.get('nom')?.invalid && patientForm.get('nom')?.touched"
            />
            <div class="invalid-feedback" *ngIf="patientForm.get('nom')?.invalid && patientForm.get('nom')?.touched">
              Le nom est requis
            </div>
          </div>

          <div class="col-md-6 mb-3">
            <label class="form-label">Prénom <span class="text-danger">*</span></label>
            <input
              type="text"
              class="form-control"
              formControlName="prenom"
              [class.is-invalid]="patientForm.get('prenom')?.invalid && patientForm.get('prenom')?.touched"
            />
            <div class="invalid-feedback" *ngIf="patientForm.get('prenom')?.invalid && patientForm.get('prenom')?.touched">
              Le prénom est requis
            </div>
          </div>
        </div>

        <div class="row">
          <div class="col-md-4 mb-3">
            <label class="form-label">Sexe <span class="text-danger">*</span></label>
            <select
              class="form-select"
              formControlName="sexe"
              [class.is-invalid]="patientForm.get('sexe')?.invalid && patientForm.get('sexe')?.touched"
            >
              <option value="">Sélectionner</option>
              <option value="M">Masculin</option>
              <option value="F">Féminin</option>
            </select>
            <div class="invalid-feedback" *ngIf="patientForm.get('sexe')?.invalid && patientForm.get('sexe')?.touched">
              Le sexe est requis
            </div>
          </div>

          <div class="col-md-4 mb-3">
            <label class="form-label">Date de Naissance <span class="text-danger">*</span></label>
            <input
              type="date"
              class="form-control"
              formControlName="dateNaissance"
              [class.is-invalid]="patientForm.get('dateNaissance')?.invalid && patientForm.get('dateNaissance')?.touched"
            />
            <div class="invalid-feedback" *ngIf="patientForm.get('dateNaissance')?.invalid && patientForm.get('dateNaissance')?.touched">
              La date de naissance est requise
            </div>
          </div>

          <div class="col-md-4 mb-3">
            <label class="form-label">Téléphone</label>
            <input type="tel" class="form-control" formControlName="telephone" />
          </div>
        </div>

        <div class="row">
          <div class="col-md-6 mb-3">
            <label class="form-label">Email</label>
            <input
              type="email"
              class="form-control"
              formControlName="email"
              [class.is-invalid]="patientForm.get('email')?.invalid && patientForm.get('email')?.touched"
            />
            <div class="invalid-feedback" *ngIf="patientForm.get('email')?.invalid && patientForm.get('email')?.touched">
              Email invalide
            </div>
          </div>
        </div>

                <div class="row">
                  <div class="col-12 mb-3">
                    <label class="form-label">Adresse</label>
                    <textarea class="form-control" rows="3" formControlName="adresse"></textarea>
                  </div>
                </div>

                <div class="d-flex justify-content-end gap-2">
                  <button type="button" class="btn btn-outline-secondary" (click)="onCancel()" [disabled]="loading">
                    Annuler
                  </button>
                  <button type="submit" class="btn btn-primary" [disabled]="loading || patientForm.invalid">
                    <span *ngIf="loading" class="spinner-border spinner-border-sm me-2"></span>
                    Enregistrer
                  </button>
                </div>
              </form>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
